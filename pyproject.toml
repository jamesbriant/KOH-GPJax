[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kohgpjax"
dynamic = ["version"]
description = "Kennedy & O'Hagan Bayesian calibration framework written in JAX and GPJax"
readme = "README.md"
requires-python = ">=3.11, <3.13" # Match GPJax range for safety
license = { text = "MIT" }
keywords = ["gaussian-processes", "jax", "machine-learning", "bayesian", "calibration", "kennedy-ohagan"]
authors = [{ name = "James Briant", email = "james.briant.21@ucl.ac.uk" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "beartype",
  "cola-ml",
  "flax",
  "gpjax>0.11.0,<=0.12.2",
  "jax>=0.5.0,<0.7",
  "jaxlib>=0.5.0,<0.7",
  "numpy>=2.0",
  "jaxtyping",
  "numpyro",
]
[project.urls]
Documentation = "https://github.com/jamesbriant/koh-gpjax"
Issues = "https://github.com/jamesbriant/koh-gpjax/issues"
Source = "https://github.com/jamesbriant/koh-gpjax"

[dependency-groups]
test = [
  "coverage>=7.2.2",
  "mktestdocs>=0.2.1",
  "pytest>=7.2.2",
  "pytest-beartype",
  "pytest-cov>=4.0.0",
  "pytest-pretty>=1.1.1",
  "pytest-xdist>=3.2.1",
  "xdoctest>=1.1.1",
]
lint = [
  "absolufy-imports>=0.3.1",
  "codespell>=2.2.4",
  "interrogate>=1.5.0",
  "jupytext",
  "pre-commit>=3.2.2",
  "ruff>=0.6",
]
docs = [
  "ipykernel",
  "ipywidgets",
  "matplotlib",
  "properdocs",
  "mkdocs-gen-files",
  "mkdocs-include-markdown-plugin",
  "mkdocs-jupyter",
  "mkdocs-literate-nav",
  "mkdocs-material",
  "mkdocstrings",
  "mkdocstrings-python",
  "nbconvert",
  "pymdown-extensions",
]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
]

[tool.hatch.version]
path = "kohgpjax/__init__.py"

[tool.pytest.ini_options]
filterwarnings = ["error", "ignore::DeprecationWarning"]
testpaths = ["tests"]
xfail_strict = true

# Ruff configuration now includes formatting options and import sorting rules.
[tool.ruff]
fix = false
cache-dir = "~/.cache/ruff"
exclude = ["docs/", "examples/"]
line-length = 88
src = ["kohgpjax", "tests"]
target-version = "py311"

[tool.ruff.format]
# This section configures ruff's formatter. It's designed to be compatible with black.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
dummy-variable-rgx = "^_$"
# Added "I" to the select list to enable isort-compatible import sorting rules.
select = [
  "F", "E", "W", "I", "YTT", "B", "Q", "PLE", "PLR", "PLW", "PIE", "PYI", "TID", "ISC"
]
ignore = [
  "B008", "E402", "E731", "E501", "S303", "S307", "RET504", "S101", "F722", "PLR2004", "PLR0912", "PLR0913", "PLR0917"
]
unfixable = ["ERA001", "F401", "F841", "T201", "T203"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"kohgpjax/__init__.py" = ['I', 'F401', 'E402', 'D104']

# The [tool.isort] section is no longer needed as ruff handles import sorting.

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
fail-under = 80
exclude = [
  "setup.py",
  "docs",
  "tests",
  "kohgpjax/__init__.py",
]
verbose = 2
quiet = false
color = true

[tool.coverage.run]
source_pkgs = ["kohgpjax", "tests"]
branch = true
parallel = true
omit = ["kohgpjax/__init__.py"]

[tool.coverage.paths]
kohgpjax = ["kohgpjax", "*/kohgpjax/"]
tests = ["tests", "*/kohgpjax/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
fail_under = 70
precision = 1
show_missing = true
skip_covered = true
